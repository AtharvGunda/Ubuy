# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8082}

# ── Datasource ──────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ubuy?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# ── SQL seed (handled safely & idempotently by DataInitializer) ──────────────
spring.sql.init.mode=never

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ubuy-dev-secret-key-change-in-production-256-bits}
jwt.expiration.ms=86400000
